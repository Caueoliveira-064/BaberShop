<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <!-- Scissors body -->
  <g transform="translate(32,32) rotate(-35)">
    <!-- Left blade -->
    <ellipse cx="-6" cy="-10" rx="3.5" ry="12" fill="#ffcc00" rx="3.5"/>
    <!-- Right blade -->
    <ellipse cx="6" cy="-10" rx="3.5" ry="12" fill="#ffcc00"/>
    <!-- Pivot screw -->
    <circle cx="0" cy="0" r="4" fill="#0a0a0a" stroke="#ffcc00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#ffcc00"/>
    <!-- Handles -->
    <ellipse cx="-8" cy="12" rx="5" ry="8" fill="none" stroke="#ffcc00" stroke-width="2"/>
    <ellipse cx="8" cy="12" rx="5" ry="8" fill="none" stroke="#ffcc00" stroke-width="2"/>
  </g>
</svg>